name: Deploy xala.no

# Auto-deploys to https://xala.no whenever main updates (a PR merge, or the
# agent fleet pushing a blog post), plus a manual "Run workflow" button.
#
# Reuses the repo's own deploy.sh so CI and local deploys never drift.
on:
  push:
    branches: [main]
    # Only CI edits are ignored. Deliberately NOT "**/*.md": blog posts ARE
    # markdown, and ignoring them on the sibling repo meant content pushes never
    # auto-deployed — a whole day of posts silently never went live.
    paths-ignore:
      - ".github/**"
      # Measurements, not site content. The daily SEO job commits here every
      # morning and redeploying production for a JSON file nobody serves is
      # pure churn — and every redeploy is a chance to ship a regression.
      - "seo-data/**"
  workflow_dispatch: {}

# One production deploy at a time; never cancel mid-rsync.
concurrency:
  group: xala-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # No version input: pnpm is pinned by "packageManager" in package.json.
      # Setting both errors with "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The whole suite, not just the blog subset it used to run.
      #
      # This is the automated half of "keep the SEO good": 413 tests including
      # the guards that titles fit a search result, that every post has an FAQ
      # section and a cover that exists, that no icon silently falls back, that
      # no internal link is dead, and that no server-side credential can reach
      # the client bundle. All of those are regressions that would otherwise
      # ship and only surface in a ranking report weeks later.
      #
      # Still fast (~3s) and still fails before anything is uploaded.
      - name: Test
        run: pnpm exec vitest run

      - name: Configure SSH access to the VPS
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # Base64 on one line, so GitHub's multi-line secret handling cannot
          # mangle the PEM.
          echo "${{ secrets.VPS_SSH_KEY }}" | base64 -d > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null
          
          # Pin known host keys for 72.61.23.56 (xala.no VPS). GitHub-hosted
          # runners sometimes cannot reach this Hostinger box, so we pin the
          # keys here rather than requiring a live scan to succeed.
          cat >> ~/.ssh/known_hosts <<'EOF'
          72.61.23.56 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHv4xAWJ3CVweX5am37hky35ODbB+gakahdfn0Pp4696
          72.61.23.56 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBMiOm1wCDblsSQRjb3hI+QOAv5BtZUCemRtYvvG+8c+D8tDICwl+JoKJ2ZZlSkmq26IY/XknAM99VHcDtHLRmBE=
          72.61.23.56 ssh-rsa 
          EOF
          chmod 644 ~/.ssh/known_hosts
          
          # Try ssh-keyscan as an optional fallback. If the runner can reach
          # the VPS, this adds fresh keys and detects rotation. If keyscan
          # returns nothing (which happens intermittently with GitHub runners
          # to this Hostinger box), the pinned keys above still allow deploys.
          for i in 1 2 3; do
            if ssh-keyscan -T 10 -H 72.61.23.56 >> ~/.ssh/known_hosts 2>/dev/null; then
              echo "ssh-keyscan succeeded on attempt $i"
              break
            fi
            [ $i -lt 3 ] && echo "ssh-keyscan attempt $i returned nothing, retrying…"
          done
          
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_deploy
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

      - name: Build + deploy (atomic release)
        run: ./deploy.sh

      # A green deploy is not evidence the site works. This fetches the live
      # site and asserts every post is prerendered, canonical and listed — the
      # regressions that otherwise ship unnoticed.
      - name: Verify the site is live
        run: |
          sleep 5
          node scripts/verify-live.mjs
