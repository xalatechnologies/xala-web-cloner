<?xml version="1.0" encoding="UTF-8"?>
<!--
  Xala mark. Replaces a #8B5CF6 -> #D946EF -> #0EA5E9 gradient X left over from
  the Lovable scaffold, which matched nothing in the brand.

  Carries its own warm-graphite ground so it stays legible against both light
  and dark browser chrome instead of disappearing into one of them.
-->
<svg width="32" height="32" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ember" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D8A263"/>
      <stop offset="100%" stop-color="#8F5B27"/>
    </linearGradient>
  </defs>

  <rect width="100" height="100" rx="22" fill="#14110F"/>

  <!-- Hairline edge, so the tile still reads as an object on white chrome -->
  <rect x="0.75" y="0.75" width="98.5" height="98.5" rx="21.5"
        fill="none" stroke="#D0934E" stroke-opacity="0.3" stroke-width="1.5"/>

  <path d="M26 26 L74 74 M74 26 L26 74"
        stroke="url(#ember)" stroke-width="13" stroke-linecap="round"/>
</svg>
