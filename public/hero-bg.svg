<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Palette -->
    <linearGradient id="g-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.88"/>
      <stop offset="60%" stop-color="#F7F3EA" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#F7F3EA" stop-opacity="1"/>
    </linearGradient>
    <radialGradient id="g-spot" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1440 120) rotate(45) scale(800 500)">
      <stop stop-color="#4F46E5" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#4F46E5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g-spot-2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(420 900) rotate(0) scale(700 420)">
      <stop stop-color="#A47864" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#A47864" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid pattern -->
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#E5E7EB" stroke-opacity="0.35" stroke-width="1"/>
    </pattern>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="20"/>
    </filter>
  </defs>

  <!-- Soft surface background -->
  <rect width="1920" height="1080" fill="url(#g-surface)"/>

  <!-- Subtle grid -->
  <rect width="1920" height="1080" fill="url(#grid)"/>

  <!-- Brand glows -->
  <rect width="1920" height="1080" fill="url(#g-spot)"/>
  <rect width="1920" height="1080" fill="url(#g-spot-2)"/>

  <!-- Technology motif: nodes & links (indigo) -->
  <g stroke="#4F46E5" stroke-opacity="0.35">
    <circle cx="240" cy="260" r="6" fill="#4F46E5" fill-opacity="0.35"/>
    <circle cx="420" cy="380" r="4" fill="#4F46E5" fill-opacity="0.35"/>
    <circle cx="620" cy="280" r="5" fill="#4F46E5" fill-opacity="0.35"/>
    <path d="M240 260C315 300 420 380 620 280" stroke-width="2"/>
    <path d="M420 380C560 470 740 520 920 460" stroke-width="1.5" stroke-dasharray="6 8"/>
  </g>

  <!-- Secondary motif: mocha accents -->
  <g stroke="#A47864" stroke-opacity="0.35">
    <circle cx="1600" cy="760" r="5" fill="#A47864" fill-opacity="0.3"/>
    <circle cx="1480" cy="640" r="4" fill="#A47864" fill-opacity="0.3"/>
    <path d="M1480 640C1540 680 1580 720 1600 760" stroke-width="1.5"/>
  </g>

  <!-- Soft top vignette for readable hero copy -->
  <rect width="1920" height="420" fill="#F7F3EA" opacity="0.6" filter="url(#blur)"/>
</svg>


