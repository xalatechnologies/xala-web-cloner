<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow" cx="0.12" cy="0.92" r="0.85">
      <stop offset="0%" stop-color="#7ED956" stop-opacity="0.19"/>
      <stop offset="45%" stop-color="#7ED956" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#7ED956" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.95" cy="0.05" r="0.7">
      <stop offset="0%" stop-color="#4A9FD8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#4A9FD8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7ED956" stop-opacity="1"/>
      <stop offset="100%" stop-color="#7ED956" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#7ED956" fill-opacity="0.14"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#0F1117"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Dot field, kept to the right so it never crowds the type -->
  <rect x="800" y="330" width="400" height="300" fill="url(#dots)"/>

  <!-- Offset brackets: a nod to code without spelling it out -->
  <g stroke="#7ED956" stroke-opacity="0.55" stroke-width="6" fill="none" stroke-linecap="square">
    <path d="M 966 210 l -34 34 l 34 34"/>
    <path d="M 1046 210 l 34 34 l -34 34"/>
  </g>

  <!-- Accent rule -->
  <rect x="96" y="196" width="360" height="4" fill="url(#rule)"/>

  <text x="96" y="150" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="22" font-weight="700" letter-spacing="7" fill="#7ED956">
    ASKER · NORGE
  </text>

  <text x="92" y="310" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="128" font-weight="700" letter-spacing="-3" fill="#FFFFFF">
    Xala
  </text>
  <text x="92" y="418" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="60" font-weight="300" letter-spacing="10" fill="#B7C0CC">
    TECHNOLOGIES
  </text>

  <text x="96" y="512" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="30" font-weight="400" fill="#E6EAF0">
    Skreddersydd programvare, AI og systemintegrasjon
  </text>

  <rect x="96" y="556" width="34" height="3" fill="#7ED956"/>
  <text x="146" y="566" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="24" font-weight="500" letter-spacing="1" fill="#9BA6B4">
    xala.no
  </text>
</svg>
