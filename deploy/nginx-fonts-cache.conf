# Include inside the xala.no server { } block, next to the /blogg?q= snippet.
#
# /fonts/ is cached for 7 days. Filenames are not content-hashed.
# Rename a font file whenever its bytes change.
#
# add_header here replaces every server-level add_header, so all four live
# headers are repeated with `always`. Values were read from the live 404 for
# https://xala.no/fonts/ (nginx/1.24.0), which is the same set a missing font
# URL returns:
#   strict-transport-security: max-age=31536000; includeSubDomains
#   x-content-type-options: nosniff
#   x-frame-options: DENY
#   referrer-policy: strict-origin-when-cross-origin
# Successful 200s on / and on font files hide those headers today: a
# location-level Cache-Control outside this repo drops them.
# public/fonts is woff2 only, plus fonts.css and OFL.txt. A location types
# block replaces the inherited map, so css and txt stay listed.
# `expires off` cancels a server-level expires, which locations inherit.
# Cache-Control has no `always`, so a 404 generated here is not stored for 7 days.
location ^~ /fonts/ {
    expires off;
    types {
        font/woff2 woff2;
        text/css css;
        text/plain txt;
    }
    add_header Cache-Control "public, max-age=604800";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri =404;
}
