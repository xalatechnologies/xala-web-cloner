# Include inside the xala.no server { } block.
#
# /blogg?q=gebyr must serve the filtered listing the prerender wrote to
# /blogg/q/gebyr/, not the unfiltered /blogg/index.html. The SPA still
# hydrates and filters client-side; this is the body a crawler reads.

location = /blogg {
    # `..` is in the token class below; without this it rewrites to
    # /blogg/q/../index.html — the unfiltered listing.
    if ($arg_q ~ "\.\.") {
        rewrite ^ /blogg/q/_none/index.html last;
    }
    if ($arg_q ~ "^[A-Za-z0-9ÆØÅæøåÄÖäöÜüÉé._-]{1,80}$") {
        rewrite ^ /blogg/q/$arg_q/index.html last;
    }
    if ($arg_q != "") {
        rewrite ^ /blogg/q/_none/index.html last;
    }
    try_files /blogg/index.html =404;
}

location = /blogg/ {
    if ($arg_q ~ "\.\.") {
        rewrite ^ /blogg/q/_none/index.html last;
    }
    if ($arg_q ~ "^[A-Za-z0-9ÆØÅæøåÄÖäöÜüÉé._-]{1,80}$") {
        rewrite ^ /blogg/q/$arg_q/index.html last;
    }
    if ($arg_q != "") {
        rewrite ^ /blogg/q/_none/index.html last;
    }
    try_files /blogg/index.html =404;
}

location ^~ /blogg/q/ {
    try_files $uri $uri/ /blogg/q/_none/index.html;
}

# /fonts/ is cached for 7 days. Filenames are not content-hashed.
# Rename a font file whenever its bytes change.
#
# add_header here replaces every server-level add_header, so nosniff and HSTS
# are repeated with `always`. HSTS is the live server value
# "max-age=31536000; includeSubDomains", taken from curl -sI of a 404
# (https://xala.no/fonts/ and a missing path). Successful 200s hide it: a
# location Cache-Control outside this repo drops the server headers.
# public/fonts is woff2 only, plus fonts.css and OFL.txt. A location types
# block replaces the inherited map, so css and txt stay listed.
# `expires off` cancels a server-level expires, which locations inherit.
location ^~ /fonts/ {
    expires off;
    types {
        font/woff2 woff2;
        text/css css;
        text/plain txt;
    }
    add_header Cache-Control "public, max-age=604800" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    try_files $uri =404;
}
