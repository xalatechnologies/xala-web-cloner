# Include inside the xala.no server { } block.
#
# /blogg?q=gebyr must serve the filtered listing the prerender wrote to
# /blogg/q/gebyr/, not the unfiltered /blogg/index.html. The SPA still
# hydrates and filters client-side; this is the body a crawler reads.

location = /blogg {
    # `..` is in the token class below; without this it rewrites to
    # /blogg/q/../index.html — the unfiltered listing.
    if ($arg_q ~ "\.\.") {
        rewrite ^ /blogg/q/_none/index.html last;
    }
    if ($arg_q ~ "^[A-Za-z0-9ÆØÅæøåÄÖäöÜüÉé._-]{1,80}$") {
        rewrite ^ /blogg/q/$arg_q/index.html last;
    }
    if ($arg_q != "") {
        rewrite ^ /blogg/q/_none/index.html last;
    }
    try_files /blogg/index.html =404;
}

location = /blogg/ {
    if ($arg_q ~ "\.\.") {
        rewrite ^ /blogg/q/_none/index.html last;
    }
    if ($arg_q ~ "^[A-Za-z0-9ÆØÅæøåÄÖäöÜüÉé._-]{1,80}$") {
        rewrite ^ /blogg/q/$arg_q/index.html last;
    }
    if ($arg_q != "") {
        rewrite ^ /blogg/q/_none/index.html last;
    }
    try_files /blogg/index.html =404;
}

location ^~ /blogg/q/ {
    try_files $uri $uri/ /blogg/q/_none/index.html;
}

# Self-hosted faces under public/fonts/. Filenames are not content-hashed,
# so the cache is 7 days and not immutable. ^~ wins over a regex asset
# location (the usual source of Cache-Control: no-cache, must-revalidate)
# without taking the SPA `location /` try_files fallback away from other paths.
# A types map here replaces the inherited one for this prefix only.
location ^~ /fonts/ {
    types {
        font/woff2 woff2;
        font/woff  woff;
        text/css   css;
        text/plain txt;
    }
    add_header Cache-Control "public, max-age=604800";
    # index.html preloads the face with crossorigin (anonymous). * matches
    # that mode if the request is ever cross-origin (www vs apex).
    add_header Access-Control-Allow-Origin "*";
}
